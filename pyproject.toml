[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gennotes"
version = "0.0.1"
description = "Hyper-secure local transcription and meeting summarizer"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Kevin Wood" }]
dependencies = [
    "Django>=5.1,<6.0",
    "argon2-cffi>=23.1",
    "whitenoise>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.7",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
]

[project.scripts]
gennotes = "gennotes.cli:main"

[tool.setuptools.packages.find]
include = ["gennotes*", "recordings*"]

[tool.setuptools.package-data]
recordings = ["summarize/prompts/**/*.txt", "templates/**/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# RUF012: Django `Meta` and ``choices`` lists are class config, not mutable defaults
ignore = ["E501", "RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/", "\\.venv/"]

[[tool.mypy.overrides]]
module = ["recordings.migrations.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "gennotes.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "gennotes.settings_dev"
python_files = ["test_*.py", "tests.py"]
addopts = "-q"
