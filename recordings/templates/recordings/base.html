{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}gennotes{% endblock %}</title>
<link rel="stylesheet" href="{% static 'gennotes/app.css' %}">
</head>
<body>
<header>
  <h1><a href="{% url 'recording-list' %}">gennotes</a></h1>
  <nav>
    <a href="{% url 'recording-list' %}">Recordings</a>
    <a href="{% url 'audit-log' %}">Audit</a>
    <a href="{% url 'doctor' %}">System</a>
    {% if user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="linkish" type="submit">Sign out</button></form>
    {% endif %}
  </nav>
</header>

{% if messages %}
  <div class="messages">
  {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
  </div>
{% endif %}

{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
