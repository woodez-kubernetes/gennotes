{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}gennotes{% endblock %}</title>
<link rel="stylesheet" href="{% static 'gennotes/app.css' %}">
</head>
<body class="auth">
<header>
  <h1>gennotes</h1>
  <span class="muted">local · offline</span>
</header>

{% if messages %}
  <div class="messages">
  {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
  </div>
{% endif %}

{% block content %}{% endblock %}
</body>
</html>
